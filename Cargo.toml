[package]
name = "nddev-device-sync-cleaner"
version = "0.0.1-alpha.4"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
authors = ["NDDev OpenNetwork"]
homepage = "https://nddev.ai"
repository = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-cleaner"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
nddev-device-sync-adapter-io = { version = "=0.0.1-alpha.4", git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-agent", rev = "f0e21ef6cab88958479de142370179b779beb2fe" }
thiserror = "2"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
cap-std = "=4.0.3"
rustix = { version = "=1.1.5", features = ["fs", "process"] }
sha2 = "0.11"
tokio = { version = "1", features = ["rt"] }
toml = "1.1.8"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
