# The repository's check through the CI library nddev-ci: a pull request runs `just check`
# and `just test`, a push to dev `just verify`, on GitHub's runners (a public repository).
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@f462390d92c31b0501c2af35e898603e49ce5baf # v0.6.101
    permissions:
      contents: read
    with:
      python-version: 3.15.2
      rust-version: 1.100.0
      rust-components: clippy,rustfmt
      tool-assets: .github/ci-tools.json
