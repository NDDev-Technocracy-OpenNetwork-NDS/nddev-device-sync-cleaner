name: main-ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-validation
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Install pinned quality tools
        run: |
          cargo install --locked --version 0.22.2 cargo-audit
          cargo install --locked --version 0.20.2 cargo-deny
      - name: Run the STD-0004 native Rust contract
        id: native
        uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/ci@a77e385fcf3c1b000c38167ecac7b74bb7715b10 # std-0004-v0.3.1
      - name: Require complete native results
        if: ${{ !cancelled() }}
        env:
          STATUS: ${{ steps.native.outputs.status }}
        run: test "$STATUS" = success
      - name: Run the RustSec advisory audit
        run: cargo audit --deny warnings

  matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Native transport tests
        run: cargo test --locked --workspace
      - name: Dependency policy and advisory checks
        if: runner.os == 'Linux'
        run: |
          cargo install --locked --version 0.20.2 cargo-deny
          cargo install --locked --version 0.22.2 cargo-audit
          cargo deny check
          cargo audit
      - name: Qualify managed development cache owners
        if: runner.os == 'Linux' || (runner.os == 'macOS' && runner.arch == 'ARM64')
        shell: bash
        run: |
          python3 scripts/prepare-cache-tools.py "$RUNNER_TEMP/cache-owners"
          cargo build --locked --release --bin nds-cleaner-cache
          python3 scripts/check-cache-provider.py --binary target/release/nds-cleaner-cache --tools "$RUNNER_TEMP/cache-owners/bin" --rustc "$(rustup which rustc)" --rustdoc "$(rustup which rustdoc)"
      - name: Qualify and stage the compatible execution artifact
        if: runner.os == 'Linux' || (runner.os == 'macOS' && runner.arch == 'ARM64')
        shell: bash
        run: |
          set -euo pipefail
          execution_source=935ba2639166d6ea368ecbab3a08d739271c3222
          execution="$RUNNER_TEMP/nds-cache-execution-source"
          git fetch --no-tags origin "$execution_source"
          git worktree add --detach "$execution" "$execution_source"
          cargo build --locked --release --manifest-path "$execution/Cargo.toml" --bin nds-cleaner-cache
          python3 "$execution/scripts/check-cache-provider.py" --binary "$execution/target/release/nds-cleaner-cache" --tools "$RUNNER_TEMP/cache-owners/bin" --rustc "$(rustup which rustc)" --rustdoc "$(rustup which rustdoc)"
          python3 scripts/package-cache-artifacts.py \
            --execution "$execution/target/release/nds-cleaner-cache" --execution-source "$execution_source" \
            --maintenance target/release/nds-cleaner-cache --maintenance-source "$(git rev-parse HEAD)" \
            --frontend "$execution/scripts/install-cache-frontends.py" --license LICENSE \
            --tools "$RUNNER_TEMP/cache-owners/source.json" --rustc "$(rustup which rustc)" \
            --output "$RUNNER_TEMP/nds-cache-native-artifacts"
          tar -czf "$RUNNER_TEMP/nds-cache-native.tar.gz" -C "$RUNNER_TEMP/nds-cache-native-artifacts" .
      - name: Retain qualified native execution and maintenance artifacts
        if: success() && (runner.os == 'Linux' || (runner.os == 'macOS' && runner.arch == 'ARM64'))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nds-cache-native-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/nds-cache-native.tar.gz
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
      - name: Fetch verified native provider
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail --location --max-time 60 https://raw.githubusercontent.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-agent/341644980976a08825b194f147b7534321325785/scripts/fetch-provider.py --output "$RUNNER_TEMP/fetch-provider.py"
          python3 "$RUNNER_TEMP/fetch-provider.py" provider.lock.json "$RUNNER_TEMP/native-provider"
      - name: Real isolated native provider acceptance
        if: runner.os == 'Linux'
        run: python3 scripts/check-provider.py
