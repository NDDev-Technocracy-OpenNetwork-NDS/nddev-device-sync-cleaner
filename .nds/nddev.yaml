# std-0001 repository manifest — schema: `nddev schema manifest`.
apiVersion: nddev.ai/v1alpha3
kind: Repository
metadata:
  id: nddev-device-sync-cleaner
  locator: github:NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-cleaner
  owner: rldyourmnd
spec:
  standard:
    id: std-0001
    version: 3.0.0
  role: component
  profiles:
  - rust
  system:
    id: nds
    root: github:NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync
  portfolios:
  - portfolio:nddev-technocracy-opennetwork-nds
  consumes:
  - contract: nddev-device-sync-agent/adapter-io
    via: Cargo.toml
  variations:
  - paths: [.gds]
    purpose: config
    reason: GDS-owned repository anchor and policy projections, excluded from std-0001 tooling per its boundary rule.
    decision: {state: approved, by: rldyourmnd, date: "2026-10-22", origin: document, reference: standarts/decisions/0013-estate-hygiene-and-standards-adoption.md}
  - paths: [module.yaml]
    purpose: manifest
    reason: NDS module descriptor owned by the product standards corpus.
    decision: {state: approved, by: rldyourmnd, date: "2026-10-22", origin: document, reference: standarts/decisions/0013-estate-hygiene-and-standards-adoption.md}
  - paths: [standarts.lock, provider.lock.json, cache-providers.lock.json]
    purpose: lock
    reason: NDS contract locks pinning the standards source and the native provider.
    decision: {state: approved, by: rldyourmnd, date: "2026-10-22", origin: document, reference: standarts/decisions/0013-estate-hygiene-and-standards-adoption.md}
  - paths: [contracts]
    purpose: manifest
    reason: NDS compiled-in runtime manifest directory owned by the module.
    decision: {state: approved, by: rldyourmnd, date: "2026-10-22", origin: document, reference: standarts/decisions/0013-estate-hygiene-and-standards-adoption.md}
  modules:
  - .
  adapters:
  - claude
  - cursor
